# Builds the background photos where strava-sync can be reached, and commits the result to the branch.
# scripts/backgrounds/backgrounds.mjs says what it makes. Runs when the selection or the script
# changes, or by hand. Run by hand with "review" ticked, it also writes contact sheets of every
# candidate (uploaded as the photo-review artifact, not committed); with backgrounds/selection.json
# it builds those photos (from strava-sync's ~1200 px copies; full-size builds come from a Strava
# export, run locally with --originals).
name: Background photos

on:
  push:
    branches-ignore: [main]
    paths:
      - backgrounds/selection.json
      - scripts/backgrounds/**
      - .github/workflows/backgrounds.yml
  workflow_dispatch:
    inputs:
      review:
        description: Write contact sheets of every candidate photo
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: backgrounds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Photo downloads from earlier runs
        uses: actions/cache@v4
        with:
          path: .cache/backgrounds
          key: backgrounds-${{ github.run_id }}
          restore-keys: backgrounds-
      - name: Contact sheets
        if: inputs.review
        run: node scripts/backgrounds/backgrounds.mjs review
      - if: inputs.review
        uses: actions/upload-artifact@v4
        with:
          name: photo-review
          path: .photo-review
      - name: Build the chosen photos
        if: hashFiles('backgrounds/selection.json') != ''
        run: node scripts/backgrounds/backgrounds.mjs build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for p in public/backgrounds src/backgrounds; do [ -e "$p" ] && git add -A "$p"; done
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Background photos: built by the Background photos workflow"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
